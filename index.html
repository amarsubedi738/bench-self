  <style>
    /* ============ RESET & BASE ============ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8fafc;
      --bg2: #ffffff;
      --bg3: #f1f5f9;
      --border: #e2e8f0;
      --border2: #cbd5e1;
      --text: #1e293b;
      --text2: #475569;
      --text3: #94a3b8;
      --blue: #2563eb;
      --blue-h: #1d4ed8;
      --green: #059669;
      --green-h: #047857;
      --red: #dc2626;
      --rose: #e11d48;
      --amber: #d97706;
      --yellow: #eab308;
      --purple: #7c3aed;
      --cyan: #0891b2;
      --pink: #db2777;
      --orange: #ea580c;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.05);
      --shadow-lg: 0 10px 15px rgba(0,0,0,.08), 0 4px 6px rgba(0,0,0,.05);
      --radius: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
      --transition: 150ms ease;
    }
    html.dark {
      --bg: #020617;
      --bg2: #0f172a;
      --bg3: #1e293b;
      --border: #1e293b;
      --border2: #334155;
      --text: #f1f5f9;
      --text2: #94a3b8;
      --text3: #475569;
      --shadow: 0 1px 3px rgba(0,0,0,.3);
      --shadow-md: 0 4px 6px rgba(0,0,0,.3);
      --shadow-lg: 0 10px 15px rgba(0,0,0,.3);
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; transition: background var(--transition), color var(--transition); -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; }
    input, textarea { font-family: inherit; }
    a { color: inherit; text-decoration: none; }

    /* ============ SCROLLBAR ============ */
    ::-webkit-scrollbar { width: 6px; } 
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ============ UTILITY ============ */
    .hidden { display: none !important; }
    .fade-in { animation: fadeIn .2s ease forwards; }
    .zoom-in { animation: zoomIn .15s ease forwards; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(4px); } to { opacity:1; transform: translateY(0); } }
    @keyframes zoomIn { from { opacity:0; transform: scale(.95); } to { opacity:1; transform: scale(1); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ============ HEADER ============ */
    #header {
      position: sticky; top: 0; z-index: 100;
      height: 60px; background: var(--bg2); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; gap: 1rem; transition: background var(--transition);
    }
    #branding { display: flex; align-items: center; gap: .75rem; cursor: pointer; }
    #logo {
      width: 38px; height: 38px; background: var(--blue); border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1.1rem; font-weight: 900; transition: background var(--transition);
    }
    #logo:hover { background: var(--blue-h); }
    #site-name { font-size: 1.15rem; font-weight: 700; letter-spacing: -.02em; }
    @media(max-width: 500px) { #site-name { display: none; } }
    #header-actions { display: flex; align-items: center; gap: .5rem; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 9px; background: transparent;
      display: flex; align-items: center; justify-content: center;
      color: var(--text2); transition: background var(--transition), color var(--transition);
    }
    .icon-btn:hover { background: var(--bg3); color: var(--text); }
    #dashboard-btn {
      display: flex; align-items: center; gap: .4rem;
      padding: .45rem .9rem; border-radius: 9px; font-size: .82rem; font-weight: 700;
      background: var(--text); color: var(--bg); transition: opacity .15s;
    }
    #dashboard-btn:hover { opacity: .85; }
    #dashboard-btn span { display: inline; }
    @media(max-width: 500px) { #dashboard-btn span { display: none; } }

    /* ============ MAIN ============ */
    #main { max-width: 1000px; margin: 0 auto; padding: 2rem 1.25rem; }

    /* ============ DASHBOARD ============ */
    #hero { margin-bottom: 2.5rem; transition: opacity .1s; }
    #hero h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); font-weight: 900; letter-spacing: -.04em; margin-bottom: .75rem; line-height: 1.1; }
    #hero p { font-size: 1rem; color: var(--text2); max-width: 560px; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .65rem 1.25rem; border-radius: 10px; font-size: .88rem; font-weight: 700;
      background: var(--blue); color: #fff; box-shadow: var(--shadow-md); transition: background .15s, transform .1s;
    }
    .btn-primary:hover { background: var(--blue-h); }
    .btn-primary:active { transform: scale(.97); }

    /* ============ TEST GRID ============ */
    #test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; margin-bottom: 1rem; }
    .test-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-xl);
      padding: 1.4rem; cursor: pointer; transition: box-shadow .15s, border-color .15s, transform .1s;
      display: flex; flex-direction: column;
    }
    .test-card:hover { box-shadow: var(--shadow-md); border-color: var(--border2); transform: translateY(-1px); }
    .test-card:active { transform: scale(.98); }
    .card-icon-wrap {
      width: 48px; height: 48px; border-radius: 12px;
      background: var(--bg3); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; margin-bottom: 1.1rem;
      transition: transform .3s;
    }
    .test-card:hover .card-icon-wrap { transform: scale(1.12); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .4rem; }
    .card-title { font-size: 1rem; font-weight: 800; }
    .card-pb { font-size: .7rem; font-family: var(--font-mono); font-weight: 700; color: #059669; background: #ecfdf5; padding: .2rem .55rem; border-radius: 6px; border: 1px solid #d1fae5; }
    html.dark .card-pb { background: #022c22; border-color: #064e3b; color: #34d399; }
    .card-desc { font-size: .83rem; color: var(--text2); flex: 1; line-height: 1.55; }
    .card-cta { margin-top: 1.2rem; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--blue); display: flex; align-items: center; gap: .3rem; opacity: .8; transition: opacity .15s; }
    .test-card:hover .card-cta { opacity: 1; }
    .cta-arrow { display: inline-block; transition: transform .2s; }
    .test-card:hover .cta-arrow { transform: translateX(3px); }

    /* Test icons */
    .icon-zap { color: #eab308; } .icon-eye { color: #0891b2; } .icon-flag { color: #dc2626; }
    .icon-binary { color: #059669; } .icon-brain { color: #7c3aed; }
    .icon-target-wrap { width: 24px; height: 24px; display:flex; align-items:center; justify-content:center; }
    /* CPS – mouse pointer: orange click-dot accent */
    .icon-mouse-ptr { display:inline-flex; align-items:center; justify-content:center; }
    /* Typing – colourful keyboard key A */
    .icon-keyboard-wrap {
      display:inline-flex; align-items:center; justify-content:center;
      background: linear-gradient(135deg,#6366f1 0%,#8b5cf6 35%,#ec4899 70%,#f97316 100%);
      border-radius: 6px; padding: 2px;
    }
    .icon-keyboard-wrap svg { display:block; }
    .target-outer { width: 24px; height: 24px; background: #3b82f6; border-radius: 50%; display:flex; align-items:center;justify-content:center; }
    .target-mid { width: 16px; height: 16px; background: #facc15; border-radius: 50%; display:flex; align-items:center;justify-content:center; }
    .target-inner { width: 7px; height: 7px; background: #ef4444; border-radius: 50%; }

    /* ============ PLAYING SCREEN ============ */
    #playing-screen, #stats-screen { display: none; }
    .back-btn {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .35rem .75rem; border-radius: 8px; font-size: .75rem; font-weight: 700;
      background: var(--bg2); border: 1px solid var(--border); color: var(--text2);
      transition: background .15s; margin-bottom: 1.2rem;
    }
    .back-btn:hover { background: var(--bg3); }
    #game-info-card {
      background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1rem 1.1rem; margin-bottom: 1.25rem; position: relative;
      max-width: 680px; margin-left: auto; margin-right: auto;
    }
    #game-info-inner { display: flex; align-items: flex-start; gap: .6rem; }
    #game-info-icon { width: 28px; height: 28px; border-radius: 7px; background: var(--bg3); border: 1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink: 0; }
    #game-info-text h2 { font-size: .95rem; font-weight: 800; margin-bottom: .25rem; }
    #game-info-text p { font-size: .8rem; color: var(--text2); line-height: 1.5; }
    #reaction-mode-toggle {
      position: absolute; top: .85rem; right: .85rem;
      display: flex; align-items: center; gap: .35rem;
      padding: .3rem .65rem; border-radius: 20px; font-size: .72rem; font-weight: 700;
      background: var(--bg3); border: 1px solid var(--border); color: var(--text);
      transition: background .15s;
    }
    #reaction-mode-toggle:hover { background: var(--border); }
    #game-component { max-width: 680px; margin: 0 auto; }

    /* ============ FOOTER CONTROLS BAR ============ */
    .hud-footer {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: .75rem; margin-top: 1.25rem; padding: .9rem 1rem;
      background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    }
    .hud-footer-text { font-size: .75rem; color: var(--text2); }
    .hud-footer-actions { display: flex; align-items: center; gap: .5rem; }
    .btn-save {
      display: flex; align-items: center; gap: .35rem;
      padding: .4rem .85rem; border-radius: 8px; font-size: .78rem; font-weight: 700;
      background: var(--green); color: #fff; transition: background .15s;
    }
    .btn-save:hover { background: var(--green-h); }
    .btn-secondary {
      padding: .4rem .8rem; border-radius: 8px; font-size: .78rem; font-weight: 600;
      background: transparent; border: 1px solid var(--border); color: var(--text2);
      transition: background .15s;
    }
    .btn-secondary:hover { background: var(--bg3); }

    /* ============ REACTION TIME ============ */
    #reaction-tap-area {
      width: 100%; min-height: 380px; border-radius: var(--radius-xl); cursor: pointer;
      border: 1px solid var(--border); background: var(--bg3); position: relative;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      transition: background .15s, border-color .15s; user-select: none; -webkit-user-select: none;
    }
    #reaction-tap-area.state-waiting { background: #ef4444; border-color: #dc2626; }
    #reaction-tap-area.state-ready { background: #10b981; border-color: #059669; }
    #reaction-tap-area .bg-icon { position: absolute; inset: 0; display:flex; align-items:center; justify-content:center; pointer-events: none; opacity: .05; }
    #reaction-tap-area .bg-icon svg { width: 200px; height: 200px; }
    .reaction-content { text-align: center; z-index: 2; position: relative; pointer-events: none; }
    .reaction-content h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: .4rem; }
    .reaction-content p { font-size: .8rem; color: var(--text2); max-width: 340px; margin: 0 auto .9rem; line-height: 1.5; }
    .reaction-content .start-hint { display: inline-block; padding: .4rem 1.1rem; background: var(--blue); color:#fff; font-size:.78rem; font-weight:700; border-radius: 8px; }
    .reaction-big { font-size: clamp(2rem, 10vw, 4rem); font-weight: 900; letter-spacing: -.03em; animation: pulse 1.2s infinite; color: #fff; }
    .reaction-go { font-size: clamp(2.5rem, 12vw, 5rem); font-weight: 900; color: #fff; animation: bounce .5s infinite; }
    .result-ms { font-size: clamp(2.5rem,12vw,4.5rem); font-weight: 900; font-family: var(--font-mono); color: var(--blue); }
    .reaction-circle {
      position: absolute; width: 76px; height: 76px; border-radius: 50%;
      background: #ef4444; cursor: pointer; transform: translate(-50%,-50%);
      box-shadow: 0 0 12px rgba(239,68,68,.5); transition: background .1s, transform .1s;
    }
    .reaction-circle.green { background: #10b981; box-shadow: 0 0 20px rgba(16,185,129,.8); transform: translate(-50%,-50%) scale(1.1); z-index: 3; }
    .session-scores { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .4rem; }
    .session-score-chip {
      font-size: .68rem; font-family: var(--font-mono); padding: .18rem .5rem;
      background: var(--bg3); border: 1px solid var(--border); border-radius: 5px; color: var(--text2);
    }

    /* ============ CPS TEST ============ */
    .cps-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin-bottom: 1.5rem; }
    .cps-stat-card {
      border-radius: 16px; padding: .85rem 1.5rem; min-width: 130px;
      display: flex; flex-direction: column; align-items: center; color: #fff;
    }
    .cps-stat-card.timer { background: linear-gradient(135deg, #6b1df2, #3a4dfc); }
    .cps-stat-card.cps { background: linear-gradient(135deg, #ff6b00, #ffaa00); }
    .cps-stat-card.score { background: linear-gradient(135deg, #00c58e, #7adb38); }
    .cps-stat-val { font-size: 1.9rem; font-weight: 900; font-family: var(--font-mono); }
    .cps-stat-label { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-top: .2rem; }
    #cps-tap-area {
      width: 100%; height: clamp(280px, 50vh, 450px); border-radius: 28px; overflow: hidden;
      background: #000; border: 1px solid #1e293b; cursor: pointer; position: relative;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none;
    }
    #cps-tap-area .cps-prompt { font-size: 1rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    #cps-result-overlay {
      position: absolute; inset: 0; background: #0f172a; border: 1px solid #1e293b;
      display: flex; align-items: center; justify-content: center; animation: fadeIn .2s;
    }
    #cps-result-overlay .inner { text-align: center; color:#fff; padding: 1.5rem; }
    #cps-result-overlay .label { font-size: .75rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .07em; margin-bottom: .5rem; }
    #cps-result-overlay .big-cps { font-size: clamp(3rem,12vw,5rem); font-weight: 900; font-family: var(--font-mono); color: #34d399; display:flex; align-items: flex-end; gap: .3rem; justify-content: center; margin-bottom: 1.25rem; }
    #cps-result-overlay .big-cps .unit { font-size: 1.6rem; color: #64748b; font-family: var(--font); font-weight: 700; margin-bottom: .5rem; }
    #cps-result-overlay p { font-size: .95rem; color: #cbd5e1; margin-bottom: 1.5rem; }
    #cps-result-overlay .cps-actions { display: flex; gap: .75rem; justify-content: center; }
    .btn-retry { display:flex; align-items:center; gap:.4rem; padding:.65rem 1.2rem; border-radius:12px; font-size:.88rem; font-weight:700; background:#1e293b; color:#e2e8f0; transition:background.15s; }
    .btn-retry:hover { background:#334155; }
    .btn-green { display:flex; align-items:center; gap:.4rem; padding:.65rem 1.2rem; border-radius:12px; font-size:.88rem; font-weight:700; background:#059669; color:#fff; box-shadow:0 0 15px rgba(16,185,129,.3); transition:background.15s; }
    .btn-green:hover { background:#047857; }

    /* ============ AIM TRAINER ============ */
    #aim-arena {
      width: 100%; height: clamp(300px, 45vh, 420px); background: #020617;
      border: 1px solid #1e293b; border-radius: var(--radius-xl); position: relative;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    #aim-arena .aim-hud { position: absolute; top: 1rem; left: 1rem; right: 1rem; display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: .72rem; color: #64748b; pointer-events: none; }
    #aim-target {
      position: absolute; width: 56px; height: 56px; border-radius: 50%;
      background: #3b82f6; cursor: pointer; transform: translate(-50%,-50%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 15px rgba(59,130,246,.5); animation: zoomIn .1s ease;
    }
    #aim-target .mid { width: 38px; height: 38px; background: #facc15; border-radius: 50%; display:flex; align-items:center; justify-content:center; }
    #aim-target .inner { width: 16px; height: 16px; background: #ef4444; border-radius: 50%; }
    .aim-center { text-align: center; color: #e2e8f0; }
    .aim-center .aim-icon-wrap { margin: 0 auto 1rem; width: 60px; height: 60px; background: #3b82f6; border-radius: 50%; display:flex; align-items:center; justify-content:center; animation: pulse 1.2s infinite; }
    .aim-center .aim-mid { width: 40px; height: 40px; background: #facc15; border-radius: 50%; display:flex; align-items:center; justify-content:center; }
    .aim-center .aim-inner { width: 15px; height: 15px; background: #ef4444; border-radius: 50%; }
    .aim-center h3 { font-size: 1.4rem; font-weight: 800; margin-bottom: .5rem; }
    .aim-center p { font-size: .82rem; color: #94a3b8; max-width: 320px; margin: 0 auto 1.5rem; }
    .aim-result { text-align: center; color: #e2e8f0; animation: fadeIn .3s; }
    .aim-result .lbl { font-size: .7rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .07em; margin-bottom: .3rem; }
    .aim-result .aim-ms { font-size: clamp(3rem, 12vw, 5rem); font-weight: 900; font-family: var(--font-mono); color: #fb7185; }
    .aim-result .aim-ms span { font-size: 1.4rem; color: #e2e8f0; font-family: var(--font); font-weight: 700; }
    .aim-result p { font-size: .85rem; color: #cbd5e1; max-width: 280px; margin: .5rem auto 1.25rem; }

    /* ============ TYPING TEST ============ */
    #typing-box {
      width: 100%; background: #0c1325; border: 1px solid #131e35;
      border-radius: 16px; padding: 1.75rem; position: relative; cursor: text;
    }
    #typing-hud { display:flex; justify-content:space-between; align-items:center; padding-bottom: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid #131e35; font-family: var(--font-mono); font-size: 0.8rem; color: #475569; letter-spacing: 0.05em; }
    #typing-passage { font-family: var(--font-mono); font-size: 1.2rem; line-height: 1.95; margin-bottom: 1.25rem; letter-spacing: .03em; word-break: break-word; overflow-wrap: break-word; white-space: pre-wrap; }
    .char-default { color: #4a5d85; }
    .char-correct { color: #ffffff; font-weight: 600; }
    .char-wrong { color: #f87171; background: rgba(248,113,113,.15); border-radius: 2px; }
    .char-cursor { color: #fff; border-bottom: 2px solid #fff; }
    #typing-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: text; resize: none; font-size: 16px; }
    #typing-complete-overlay {
      position: absolute; inset: 0; border-radius: var(--radius-xl);
      background: rgba(2,6,23,.75); display: flex; align-items: center; justify-content: center;
      animation: fadeIn .2s; backdrop-filter: blur(2px);
    }
    #typing-complete-overlay .inner { text-align: center; color: #fff; padding: 1.5rem; }
    #typing-complete-overlay .tc-stats { display: flex; gap: 2.5rem; justify-content: center; margin: 1rem 0 1.5rem; font-family: var(--font-mono); }
    #typing-complete-overlay .tc-stat-val { font-size: clamp(2rem, 8vw, 3rem); font-weight: 900; }
    #typing-complete-overlay .tc-stat-lbl { font-size: .7rem; color: #94a3b8; }
    #typing-complete-overlay .wpm-val { color: #60a5fa; }
    #typing-complete-overlay .acc-val { color: #34d399; }
    .typing-refresh { display:flex; align-items:center; gap:.3rem; padding:.4rem .75rem; border-radius:7px; font-size:.78rem; font-weight:600; background:transparent; color:var(--text2); border:1px solid var(--border); transition:background.15s; }
    .typing-refresh:hover { background:var(--bg3); }

    /* ============ NUMBER MEMORY ============ */
    #number-arena {
      width: 100%; min-height: 280px; background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 2rem; display: flex; align-items: center;
      justify-content: center; position: relative;
    }
    .num-content { text-align: center; width: 100%; max-width: 400px; }
    .num-level-badge { display: inline-block; font-size: .68rem; font-weight: 700; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .08em; background: #dbeafe; color: #1d4ed8; border-radius: 20px; padding: .2rem .75rem; margin-bottom: 1.5rem; }
    html.dark .num-level-badge { background: #1e3a8a; color: #93c5fd; }
    .num-display { font-size: clamp(2.5rem, 12vw, 5rem); font-weight: 900; font-family: var(--font-mono); letter-spacing: .1em; animation: zoomIn .15s; margin: 1rem 0; }
    .num-progress { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .num-progress-bar { height: 100%; background: var(--blue); border-radius: 3px; transition: width .04s linear; }
    .num-input { 
      width: 100%; text-align: center; font-size: clamp(1.8rem, 8vw, 3rem); font-weight: 900; font-family: var(--font-mono);
      border: 2px solid var(--border); border-radius: 12px; padding: .6rem 1rem; background: var(--bg2);
      color: var(--text); outline: none; margin-bottom: 1.25rem; transition: border-color .15s;
    }
    .num-input:focus { border-color: var(--blue); }
    .btn-submit { width: 100%; padding: .8rem; border-radius: 10px; font-size: .9rem; font-weight: 700; background: var(--text); color: var(--bg); transition: opacity .15s; }
    .btn-submit:hover { opacity: .85; }
    .result-check { font-size: 3rem; margin-bottom: .5rem; }
    .result-title { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: .5rem; }
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: .9rem; margin: .9rem auto; max-width: 300px; font-family: var(--font-mono); text-align: left; font-size: .8rem; }
    .compare-grid .lbl { color: var(--text2); font-family: var(--font); font-size: .7rem; display:block; margin-bottom: .2rem; }
    .compare-grid .correct-val { font-size: 1.2rem; font-weight: 700; color: var(--text); }
    .compare-grid .wrong-val { font-size: 1.2rem; font-weight: 700; color: var(--rose); }

    /* ============ CHIMP TEST ============ */
    #chimp-arena {
      width: 100%; min-height: 320px; background: #0f172a; border: 1px solid #1e293b;
      border-radius: var(--radius-xl); padding: 1.4rem; display: flex; align-items: center;
      justify-content: center;
    }
    #chimp-grid {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; width: 100%;
      max-width: 480px; background: #020617; border: 1px solid #0f172a; border-radius: 12px; padding: .75rem;
    }
    .chimp-slot { aspect-ratio: 1; border-radius: 7px; }
    .chimp-tile {
      aspect-ratio: 1; border-radius: 7px; cursor: pointer; font-weight: 900; font-family: var(--font-mono);
      font-size: clamp(.75rem, 2.5vw, 1rem); display: flex; align-items: center; justify-content: center;
      transition: transform .1s, background .1s;
    }
    .chimp-tile.visible { background: #fff; color: #1e293b; border: 1px solid #e2e8f0; }
    .chimp-tile.visible:hover { background: #f1f5f9; transform: scale(.96); }
    .chimp-tile.masked { background: #334155; color: #334155; }
    .chimp-tile.masked:hover { background: #3b82f6; }
    .chimp-hud { display:flex; justify-content:space-between; align-items:center; width:100%; max-width:480px; font-family:var(--font-mono); font-size:.72rem; color:#64748b; margin-bottom:.9rem; }
    .chimp-tiles-count { color: #fbbf24; font-weight: 700; }
    .chimp-strikes { color: #f87171; font-weight: 700; background: rgba(248,113,113,.1); padding: .2rem .5rem; border-radius: 5px; }
    .chimp-center { text-align:center; color:#e2e8f0; }
    .chimp-result-score { font-size: clamp(3rem,12vw,5rem); font-weight:900; font-family:var(--font-mono); color:#f87171; }
    .chimp-result-score span { font-size:1.4rem; color:#e2e8f0; font-family:var(--font); font-weight:700; }

    /* ============ VISUAL MEMORY ============ */
    #visual-arena {
      width: 100%; min-height: 320px; background: #0f172a; border: 1px solid #1e293b;
      border-radius: var(--radius-xl); padding: 1.4rem; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    #visual-hud { display:flex; justify-content:space-between; align-items:center; width:100%; max-width:340px; font-family:var(--font-mono); font-size:.72rem; color:#64748b; margin-bottom:.9rem; }
    #visual-grid { aspect-ratio:1; width:100%; max-width: 320px; min-width:240px; display:grid; gap:8px; background:#020617; border:1px solid #0f172a; border-radius:12px; padding:.7rem; }
    .vt { aspect-ratio:1; border-radius:8px; background:#1e293b; border:1px solid #1e293b; cursor:pointer; transition:background .1s, transform .1s; }
    .vt:active { transform:scale(.94); }
    .vt.flash { background:#fff; box-shadow:0 0 12px rgba(255,255,255,.7); transform:scale(.95); }
    .vt.guessed { background:#3b82f6; box-shadow:0 0 10px rgba(59,130,246,.5); }
    .vt.mistake { background:#ef4444; box-shadow:0 0 10px rgba(239,68,68,.5); }
    .visual-center { text-align:center; color:#e2e8f0; }
    .heart { display:inline-block; width:14px; height:14px; position:relative; }
    .heart svg { width:14px; height:14px; }
    .visual-result-score { font-size:clamp(3rem,12vw,5rem); font-weight:900; font-family:var(--font-mono); color:#f87171; }
    .visual-result-score span { font-size:1.4rem; color:#e2e8f0; font-family:var(--font); font-weight:700; }

    /* ============ F1 REFLEX ============ */
    #f1-main {
      width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-xl);
      padding: 2rem 1.5rem; display: flex; flex-direction: column; align-items: center; cursor: pointer;
      min-height: clamp(400px, 60vh, 700px); position: relative; user-select:none; -webkit-user-select:none;
    }
    .f1-ref-sub { font-size: .72rem; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; height: 1.2rem; margin-bottom: .5rem; }
    .f1-timer { font-size: clamp(3.5rem, 14vw, 7.5rem); font-family: var(--font-mono); font-weight: 900; text-align: center; tabular-nums; line-height:1; margin-bottom: 2rem; }
    .f1-timer.jump { color: var(--red); }
    .f1-lights-track { position:relative; margin-bottom: 2rem; }
    .f1-lights-track-bar { position:absolute; top:50%; left:-10px; right:-10px; height:12px; background:#111; border-radius:6px; transform:translateY(-50%); z-index:0; }
    html.dark .f1-lights-track-bar { background:#000; }
    .f1-lights { display:flex; gap:.5rem; position:relative; z-index:1; }
    .f1-panel { width: clamp(52px,13vw,64px); height: clamp(150px,28vw,192px); background:#111; border-radius:14px; display:flex; flex-direction:column; justify-content:space-evenly; align-items:center; padding:.3rem; }
    html.dark .f1-panel { background:#000; }
    .f1-light { width:clamp(28px,8vw,42px); height:clamp(28px,8vw,42px); border-radius:50%; background:#222; transition:background 0s, box-shadow 0s; }
    .f1-light.lit { background:#ff0000; box-shadow:0 0 15px rgba(255,0,0,.8); }
    .f1-instruction { font-size:.85rem; color:var(--text2); text-align:center; height:1.5rem; margin-bottom:1.5rem; }
    .f1-done-actions { position:absolute; bottom:1.5rem; left:0; right:0; display:flex; gap:.75rem; justify-content:center; animation:fadeIn .3s; }
    .f1-done-actions button { pointer-events:auto; }

    /* ============ STATS SCREEN ============ */
    .stats-stat-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin-bottom:1.5rem; }
    .stats-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:1.1rem; text-align:center; }
    .stats-card .lbl { font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text3); display:block; margin-bottom:.3rem; }
    .stats-card .val { font-size:2rem; font-weight:900; font-family:var(--font-mono); color:var(--blue); }
    .stats-card .sub { font-size:.68rem; color:var(--text3); margin-top:.2rem; }
    .stats-card.neutral .val { color:var(--text); }
    .stats-card.muted .val { color:var(--text3); }
    .stats-history-wrap { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:1rem; }
    .stats-box { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:1.1rem; }
    .stats-box h4 { font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; border-bottom:1px solid var(--border); padding-bottom:.6rem; margin-bottom:.75rem; }
    .history-list { max-height:240px; overflow-y:auto; display:flex; flex-direction:column; gap:.4rem; }
    .history-item { display:flex; align-items:center; justify-content:space-between; padding:.4rem .7rem; background:var(--bg3); border:1px solid var(--border); border-radius:8px; font-size:.73rem; }
    .history-item .run-num { font-family:var(--font-mono); color:var(--text2); }
    .history-item .run-score { font-weight:700; font-family:var(--font-mono); }
    .history-item .run-date { font-size:.65rem; color:var(--text3); display:flex; align-items:center; gap:.25rem; }
    .stats-info-box { background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:.85rem; font-size:.75rem; color:var(--text2); line-height:1.55; margin-top:.75rem; }
    .stats-info-box strong { color:var(--blue); display:block; margin-bottom:.3rem; }
    .empty-state { display:flex; align-items:center; justify-content:center; padding:3rem; color:var(--text3); font-size:.8rem; font-style:italic; }

    /* ============ DASHBOARD DRAWER ============ */
    #drawer-overlay { position:fixed; inset:0; z-index:200; display:none; }
    #drawer-overlay.open { display:flex; justify-content:flex-end; }
    #drawer-backdrop { position:absolute; inset:0; background:rgba(15,23,42,.3); backdrop-filter:blur(3px); }
    html.dark #drawer-backdrop { background:rgba(0,0,0,.5); }
    #drawer {
      width: min(420px, 100vw); height:100%; background:var(--bg2); border-left:1px solid var(--border);
      box-shadow:var(--shadow-lg); display:flex; flex-direction:column; position:relative; z-index:1;
      animation: slideIn .25s ease;
    }
    @keyframes slideIn { from { transform:translateX(100%); } to { transform:translateX(0); } }
    #drawer-header { display:flex; align-items:center; justify-content:space-between; padding:1.25rem 1.5rem; border-bottom:1px solid var(--border); }
    #drawer-header h2 { font-size:1rem; font-weight:800; display:flex; align-items:center; gap:.4rem; }
    #drawer-body { flex:1; overflow-y:auto; padding:1.25rem 1.5rem; }
    #drawer-footer { padding:1.25rem 1.5rem; border-top:1px solid var(--border); background:var(--bg3); }

    /* Profile card */
    #profile-card { background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius); padding:1.1rem; margin-bottom:1.5rem; position:relative; }
    .profile-row { display:flex; align-items:center; gap:.9rem; }
    #user-avatar { width:52px; height:52px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--text3); flex-shrink:0; }
    .profile-meta { flex:1; }
    .profile-meta .lbl { font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text3); }
    #username-display { font-size:1.2rem; font-weight:800; display:flex; align-items:center; gap:.4rem; margin-top:.15rem; }
    #edit-name-btn { color:var(--text3); padding:0; background:transparent; transition:color .15s; }
    #edit-name-btn:hover { color:var(--text); }
    #edit-form { display:none; align-items:center; gap:.35rem; margin-top:.3rem; }
    #edit-form.visible { display:flex; }
    #edit-input { border:1px solid var(--blue); background:var(--bg2); color:var(--text); border-radius:6px; padding:.25rem .5rem; font-size:.9rem; font-weight:700; outline:none; width:100%; }
    .edit-confirm-btn, .edit-cancel-btn { padding:.25rem; border-radius:5px; background:transparent; transition:background .15s; }
    .edit-confirm-btn { color:#10b981; } .edit-confirm-btn:hover { background:rgba(16,185,129,.1); }
    .edit-cancel-btn { color:var(--text3); } .edit-cancel-btn:hover { background:var(--bg3); }
    .profile-joined { font-size:.72rem; color:var(--text3); display:flex; align-items:center; gap:.3rem; margin-top:.3rem; }
    #share-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:.4rem; padding:.5rem; border-radius:8px; font-size:.75rem; font-weight:700; background:var(--bg2); border:1px solid var(--border); color:var(--text2); margin-top:.75rem; transition:background .15s; }
    #share-btn:hover { background:var(--bg); }
    #share-toast { position:absolute; top:-10px; right:-10px; background:#1e293b; border:1px solid #334155; color:#fff; padding:.35rem .75rem; border-radius:8px; font-size:.7rem; font-family:var(--font-mono); display:none; align-items:center; gap:.3rem; animation:bounce .5s infinite; z-index:5; }
    #share-toast.visible { display:flex; }
    html.dark #share-toast { background:#0f172a; border-color:#1e293b; }

    /* Records list */
    .records-section h3 { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text2); margin-bottom:.75rem; }
    .record-item { background:var(--bg3); border:1px solid var(--border); border-radius:12px; padding:.9rem; margin-bottom:.6rem; }
    .record-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:.5rem; }
    .record-name { font-size:.85rem; font-weight:700; display:flex; align-items:center; gap:.4rem; }
    .record-view-btn { font-size:.7rem; font-weight:700; color:var(--blue); background:transparent; display:flex; align-items:center; gap:.25rem; }
    .record-view-btn:hover { text-decoration:underline; }
    .record-bottom { display:flex; align-items:flex-end; justify-content:space-between; }
    .record-score { font-family:var(--font-mono); font-size:1.15rem; font-weight:900; }
    .record-score .unit { font-size:.72rem; color:var(--text2); font-family:var(--font); font-weight:600; margin-left:.2rem; }
    .no-score { font-size:.75rem; color:var(--text3); font-style:italic; }
    .play-btn { font-size:.65rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:.25rem .55rem; border-radius:5px; background:var(--bg); color:var(--text); transition:background .15s; }
    .play-btn:hover { background:var(--border); }
    #reset-btn { width:100%; display:flex; align-items:center; justify-content:center; gap:.5rem; padding:.65rem; border-radius:9px; font-size:.85rem; font-weight:700; color:#dc2626; background:#fef2f2; border:1px solid #fee2e2; transition:background .15s; }
    html.dark #reset-btn { background:rgba(127,29,29,.15); border-color:rgba(127,29,29,.3); color:#fca5a5; }
    #reset-btn:hover { background:#fee2e2; }
    html.dark #reset-btn:hover { background:rgba(127,29,29,.3); }

    /* ============ FAQ ============ */

function loadStats() {
  try {
    const raw = localStorage.getItem('benchself_stats');
    if (raw) { userStats = JSON.parse(raw); return; }
  } catch(e) {}
  initNewUser();
}

function initNewUser() {
  userStats = {
    username: 'Guest user',
    joinedAt: new Date().toISOString(),
    scores: {}
  };
  TESTS.forEach(t => { userStats.scores[t.id] = []; });
  saveStats();
}

function saveStats() {
  localStorage.setItem('benchself_stats', JSON.stringify(userStats));
}

function getPersonalBest(testId) {
  const test = TESTS.find(t => t.id === testId);
  const history = userStats?.scores[testId] || [];
  if (!history.length || !test) return null;
  const vals = history.map(h => h.score);
  return test.highScoreBetter ? Math.max(...vals) : Math.min(...vals);
}

function saveScore(testId, score, quiet = false) {
  if (!userStats) return;
  if (quiet) {
    const pb = getPersonalBest(testId);
    const test = TESTS.find(t => t.id === testId);
    if (pb !== null && test) {
      const better = test.highScoreBetter ? score > pb : score < pb;
      if (!better) return;
    }
  }
  if (!userStats.scores[testId]) userStats.scores[testId] = [];
  userStats.scores[testId].push({ score, date: new Date().toLocaleDateString() });
  saveStats();
  if (!quiet) goHome();
}

function calculatePercentile(score, test) {
  if (score <= 0) return 0;
  let z = (score - test.mean) / test.sd;
  if (!test.highScoreBetter) z = -z;
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989422804;
  const p = d * Math.exp(-0.5 * z * z) * (t * (0.31938153 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429)))));
  let pct = Math.round((z >= 0 ? 1 - p : p) * 100);
  return Math.max(1, Math.min(99, pct));
}

  grid.innerHTML = TESTS.map(test => {
    const pb = getPersonalBest(test.id);
    const pbBadge = pb !== null ? `<span class="card-pb">${pb} ${test.unit}</span>` : '';
    return `
      <article class="test-card fade-in" role="listitem" onclick="startTest('${test.id}')" tabindex="0" aria-label="Start ${test.name} test">
        <div class="card-icon-wrap">${getIconHTML(test.icon)}</div>
        <div class="card-header">
          <h3 class="card-title">${test.name}</h3>
          ${pbBadge}
        </div>
        <p class="card-desc">${test.description}</p>
        <div class="card-cta">Test Now <span class="cta-arrow">→</span></div>
      </article>`;
  }).join('');
  renderFAQ('dashboard-faqs', DASHBOARD_FAQS, 'BenchSelf FAQs');
  
  // Hero scroll opacity
  const hero = document.getElementById('hero');
  window.addEventListener('scroll', () => {
    if (currentScreen !== 'dashboard') return;
    hero.style.opacity = Math.max(0, 1 - window.scrollY / 250);
  }, { passive: true });
}

/* ===================================================================
   PLAYING SCREEN RENDER
   =================================================================== */
function renderPlayingScreen() {
  const test = TESTS.find(t => t.id === activeTestId);
  if (!test) return;

  // Info card
  document.getElementById('game-info-icon').innerHTML = getIconHTML(test.icon, 16);
  document.getElementById('game-info-title').textContent = test.name + ' Setup';
  document.getElementById('game-info-desc').textContent = test.instructions;

  const toggleBtn = document.getElementById('reaction-mode-toggle');
  if (toggleBtn) {
    if (activeTestId === 'reaction-time') {
      toggleBtn.classList.remove('hidden');
      toggleBtn.textContent = reactionMode === 'circle' ? 'Switch to Flat Mode' : 'Switch to Circle Mode';
    } else {
      toggleBtn.classList.add('hidden');
    }
  }

  // Render game component
  const container = document.getElementById('game-component');
  switch (activeTestId) {
    case 'reaction-time': renderReactionTime(container); break;
    case 'cps-test': renderCpsTest(container); break;
    case 'aim-trainer': renderAimTrainer(container); break;
    case 'typing': renderTypingTest(container); break;
    case 'number-memory': renderNumberMemory(container); break;
    case 'chimp-test': renderChimpTest(container); break;
    case 'visual-memory': renderVisualMemory(container); break;
    case 'f1-reflex': renderF1Reflex(container); break;
  }

  if (test.faqs) renderFAQ('game-faqs', test.faqs, `${test.name} FAQs`);
  else document.getElementById('game-faqs').innerHTML = '';
}

function toggleReactionMode() {
  reactionMode = reactionMode === 'flat' ? 'circle' : 'flat';
  const container = document.getElementById('game-component');
  if (activeTestId === 'reaction-time') renderReactionTime(container);
  renderPlayingScreen();
}

/* ===================================================================
   FAQ RENDER
   =================================================================== */
function renderFAQ(containerId, faqs, title) {
  const el = document.getElementById(containerId);
  if (!faqs || !faqs.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<h2>${title}</h2>` + faqs.map(f => `
    <details class="faq-item">
      <summary class="faq-summary">
        <span>${f.q || f.question}</span>
        <svg class="faq-chevron icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="faq-body">${f.a || f.answer}</div>
    </details>`).join('');
}

/* ===================================================================
   GAME: REACTION TIME
   =================================================================== */
let rtState = 'idle'; // idle|waiting|ready|clicked|early
let rtMs = null;
let rtRecentScores = [];
let rtTimeout = null;
let rtStartTime = 0;
let rtCircles = [];
let rtAnimFrame = null;
let rtLastTime = 0;

function renderReactionTime(container) {
  rtState='idle'; rtMs=null; rtRecentScores=[];
  if(rtTimeout) clearTimeout(rtTimeout);
  if(rtAnimFrame) cancelAnimationFrame(rtAnimFrame);

  container.innerHTML = `
    <div id="reaction-container">
      <div id="reaction-tap-area"
        onmousedown="handleRTParent(event)"
        ontouchstart="handleRTParent(event)">
        <div class="bg-icon"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
        <div id="rt-content" class="reaction-content"></div>
      </div>
      <div class="hud-footer">
        <div id="rt-session" style="flex:1;"></div>
        <div class="hud-footer-actions">
          <button id="rt-save-btn" class="btn-save hidden" onclick="event.stopPropagation();saveScore(activeTestId,rtMs)">
            <svg class="icon" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save Score
          </button>
          <button class="btn-secondary" onclick="goHome()">Back to Dashboard</button>
        </div>
      </div>
    </div>`;
  updateRTDisplay();
}

function updateRTDisplay() {
  const area = document.getElementById('reaction-tap-area');
  const content = document.getElementById('rt-content');
  const saveBtn = document.getElementById('rt-save-btn');
  if (!area || !content) return;

  area.className = reactionMode === 'circle' ? 'state-idle' : 'state-' + rtState;
  if (saveBtn) saveBtn.classList.toggle('hidden', !(rtMs !== null && rtState === 'clicked'));

  if (reactionMode === 'circle') {
    if (rtState === 'idle') {
      // Clean up circles container if present
      const cc = document.getElementById('rt-circles-container');
      if (cc) cc.innerHTML = '';
      content.innerHTML = `
        <svg class="icon icon-zap" style="width:44px;height:44px;animation:bounce 1s infinite;margin:0 auto 10px;display:block;" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <h3>Reaction Time Test</h3>
        <p>Wait for a circle to turn green, then tap it as fast as you can.</p>
        <span class="start-hint">Tap / Click to Start</span>`;
    } else if (rtState === 'waiting' || rtState === 'ready') {
      // Circles are rendered via the animation loop — never restart it here if already running
      content.innerHTML = `<div class="reaction-big" style="font-size:1.5rem; animation:none; opacity:0.5; position:relative; z-index:2;">TAP NOW!</div><p style="font-size:0.8rem; opacity:0.5; position:relative; z-index:2;">Hurry!</p>`;
      let cc = document.getElementById('rt-circles-container');
      if (!cc) {
        // Only on first entry (waiting): create container and start the loop
        cc = document.createElement('div');
        cc.id = 'rt-circles-container';
        cc.style.cssText = 'position:absolute; inset:0; pointer-events:auto; z-index:3;';
        // Tapping the background of the container (not a circle) restarts after clicked/early
        cc.addEventListener('pointerdown', function(ev) {
          if (ev.target !== cc) return; // only bare background, not a circle div
          if (rtState === 'clicked' || rtState === 'early') rtStart(ev);
        });
        area.appendChild(cc);
        startRTCircleAnim();
      }
      // ready state: container already exists, loop already running — do nothing extra
    } else if (rtState === 'early') {
      // Stop animation and clear circles
      if (rtAnimFrame) { cancelAnimationFrame(rtAnimFrame); rtAnimFrame = null; }
      const cc = document.getElementById('rt-circles-container');
      if (cc) cc.innerHTML = '';
      content.innerHTML = `
        <div style="position:relative; z-index:10; background:rgba(2,6,23,0.85); padding:1.5rem; border-radius:1rem; backdrop-filter:blur(2px);">
          <h3 style="font-size:1.5rem;font-weight:800;color:#d97706;margin-bottom:.4rem;">Too Early!</h3>
          <p style="font-size:.78rem;color:var(--text2);margin-bottom:.75rem;">You clicked before it turned green.</p>
          <span class="start-hint" style="background:var(--bg3);color:var(--text);">Tap Background to Try Again</span>
        </div>`;
    } else if (rtState === 'clicked' && rtMs !== null) {
      // Stop animation and clear circles
      if (rtAnimFrame) { cancelAnimationFrame(rtAnimFrame); rtAnimFrame = null; }
      const cc = document.getElementById('rt-circles-container');
      if (cc) cc.innerHTML = '';
      const msg = rtMs < 150 ? 'Incredible speed! Human flash!' : rtMs < 250 ? 'Fast! Excellent visual reflexes.' : rtMs < 350 ? 'Average reflex reaction speed.' : 'A bit slow. Keep training!';
      content.innerHTML = `
        <div style="position:relative; z-index:10; background:rgba(2,6,23,0.85); padding:1.5rem; border-radius:1rem; backdrop-filter:blur(2px);">
          <p style="font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);margin-bottom:.3rem;">Your Reaction Speed</p>
          <div class="result-ms">${rtMs}<span style="font-size:1.2rem;font-weight:700;color:var(--text);margin-left:.25rem;">ms</span></div>
          <p style="font-size:.78rem;color:var(--text2);margin:.6rem 0;">${msg}</p>
          <span class="start-hint" style="background:var(--bg3);color:var(--text);">Tap Background to Play Again</span>
        </div>`;
    }
  } else {
    if (rtState === 'idle') {
      content.innerHTML = `
        <svg class="icon icon-zap" style="width:44px;height:44px;animation:bounce 1s infinite;margin:0 auto 10px;display:block;" fill="currentColor" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <h3>Reaction Time Test</h3>
        <p>When the red box turns green, click anywhere as fast as you can.</p>
        <span class="start-hint">Tap / Click to Start</span>`;
    } else if (rtState === 'waiting') {
      content.innerHTML = `<div class="reaction-big">Wait for green...</div>`;
    } else if (rtState === 'ready') {
      content.innerHTML = `<div class="reaction-go">Click!</div>`;
    } else if (rtState === 'early') {
      content.innerHTML = `
        <h3 style="font-size:1.5rem;font-weight:800;color:#d97706;margin-bottom:.4rem;">Too Early!</h3>
        <p style="font-size:.78rem;color:var(--text2);margin-bottom:.75rem;">You clicked before the box turned green.</p>
        <span class="start-hint" style="background:var(--bg3);color:var(--text);">Tap Background to Try Again</span>`;
    } else if (rtState === 'clicked' && rtMs !== null) {
      const msg = rtMs < 150 ? 'Incredible speed! Human flash!' : rtMs < 250 ? 'Fast! Excellent visual reflexes.' : rtMs < 350 ? 'Average reflex reaction speed.' : 'A bit slow. Keep training!';
      content.innerHTML = `
        <p style="font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text2);margin-bottom:.3rem;">Your Reaction Speed</p>
        <div class="result-ms">${rtMs}<span style="font-size:1.2rem;font-weight:700;color:var(--text);margin-left:.25rem;">ms</span></div>
        <p style="font-size:.78rem;color:var(--text2);margin:.6rem 0;">${msg}</p>
        <span class="start-hint" style="background:var(--bg3);color:var(--text);">Tap Background to Play Again</span>`;
    }
  }

  // Session scores
  const session = document.getElementById('rt-session');
  if (session && rtRecentScores.length > 0) {
    session.innerHTML = `<div style="font-size:.65rem;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem;">Session Attempts:</div>
      <div class="session-scores">${rtRecentScores.map((s,i)=>`<span class="session-score-chip">#${i+1}: ${s}ms</span>`).join('')}</div>`;
  }
}

function startRTCircleAnim() {
  if (rtAnimFrame) cancelAnimationFrame(rtAnimFrame);
  const container = document.getElementById('rt-circles-container');
  if (!container) return;

  const R        = 38;      // circle radius px
  const MIN_SEP  = R*2 + 8; // min centre-to-centre (no overlap)
  const SPEED    = 2.8;     // constant travel speed (px/frame at 60fps)
  const STEER_INT = 1800;   // ms between random direction nudges

  const W0 = container.clientWidth  || document.getElementById('reaction-tap-area').clientWidth;
  const H0 = container.clientHeight || document.getElementById('reaction-tap-area').clientHeight;

  // Start circles well apart — triangle formation
  const slots = [
    { x: W0 * 0.22, y: H0 * 0.28 },
    { x: W0 * 0.78, y: H0 * 0.28 },
    { x: W0 * 0.50, y: H0 * 0.72 },
  ];

  const now = performance.now();
  rtCircles = slots.map((s, i) => {
    const angle = Math.random() * Math.PI * 2;
    return {
      id: i,
      x:  Math.max(R, Math.min(W0 - R, s.x)),
      y:  Math.max(R, Math.min(H0 - R, s.y)),
      dx: Math.cos(angle) * SPEED,
      dy: Math.sin(angle) * SPEED,
      isTarget: i === 0,
      frozen: false,           // true once circle turns green
      nextSteer: now + 500 + Math.random() * STEER_INT,
    };
  });

  rtLastTime = now;

  function loop(t) {
    if (rtState !== 'waiting' && rtState !== 'ready') return;
    const dt = Math.min(t - rtLastTime, 32);
    rtLastTime = t;
    const con = document.getElementById('rt-circles-container');
    if (!con) return;

    const W = con.clientWidth  || W0;
    const H = con.clientHeight || H0;
    const f = dt / 16; // scale factor (1.0 at 60 fps)

    // ── 1. Move each circle ────────────────────────────────────────────
    rtCircles.forEach(c => {
      // Green target: freeze exactly where it is, no movement at all
      if (rtState === 'ready' && c.isTarget) {
        if (!c.frozen) c.frozen = true;
        return; // position unchanged every frame
      }
      if (c.frozen) return;

      // Random smooth steering: gently bend direction every ~1.8s
      if (t >= c.nextSteer) {
        const turnAngle = (Math.random() - 0.5) * Math.PI * 0.9; // ±81°
        const cos = Math.cos(turnAngle), sin = Math.sin(turnAngle);
        const ndx = c.dx * cos - c.dy * sin;
        const ndy = c.dx * sin + c.dy * cos;
        c.dx = ndx; c.dy = ndy;
        c.nextSteer = t + STEER_INT * (0.5 + Math.random());
      }

      // Move
      c.x += c.dx * f;
      c.y += c.dy * f;

      // Keep constant speed (no drift from repulsion impulses)
      const spd = Math.sqrt(c.dx*c.dx + c.dy*c.dy);
      if (spd > 0.01) { c.dx = c.dx/spd * SPEED; c.dy = c.dy/spd * SPEED; }

      // Wall bounce — reflect angle, clamp position (no teleport)
      if (c.x < R)     { c.dx =  Math.abs(c.dx); c.x = R; }
      if (c.x > W - R) { c.dx = -Math.abs(c.dx); c.x = W - R; }
      if (c.y < R)     { c.dy =  Math.abs(c.dy); c.y = R; }
      if (c.y > H - R) { c.dy = -Math.abs(c.dy); c.y = H - R; }
    });

    // ── 2. Circle-circle collision (elastic-style, no overlap) ────────
    for (let a = 0; a < rtCircles.length; a++) {
      for (let b = a + 1; b < rtCircles.length; b++) {
        const ca = rtCircles[a], cb = rtCircles[b];
        const nx = cb.x - ca.x, ny = cb.y - ca.y;
        const dist = Math.sqrt(nx*nx + ny*ny) || 0.001;
        if (dist >= MIN_SEP) continue;

        const ux = nx/dist, uy = ny/dist;
        const overlap = (MIN_SEP - dist) / 2;

        // Push apart smoothly (split the overlap)
        if (!ca.frozen) { ca.x -= ux*overlap; ca.y -= uy*overlap; }
        if (!cb.frozen) { cb.x += ux*overlap; cb.y += uy*overlap; }

        // Reflect velocity components along collision axis
        if (!ca.frozen) {
          const dot = ca.dx*ux + ca.dy*uy;
          if (dot > 0) { ca.dx -= dot*ux; ca.dy -= dot*uy; } // flip toward component
        }
        if (!cb.frozen) {
          const dot = cb.dx*ux + cb.dy*uy;
          if (dot < 0) { cb.dx -= dot*ux; cb.dy -= dot*uy; }
        }

        // Restore constant speed after collision
        [ca, cb].forEach(c => {
          if (c.frozen) return;
          const spd = Math.sqrt(c.dx*c.dx + c.dy*c.dy);
          if (spd > 0.01) { c.dx = c.dx/spd * SPEED; c.dy = c.dy/spd * SPEED; }
          // Re-clamp inside walls
          if (c.x < R)     { c.dx =  Math.abs(c.dx); c.x = R; }
          if (c.x > W - R) { c.dx = -Math.abs(c.dx); c.x = W - R; }
          if (c.y < R)     { c.dy =  Math.abs(c.dy); c.y = R; }
          if (c.y > H - R) { c.dy = -Math.abs(c.dy); c.y = H - R; }
        });
      }
    }

    // ── 3. Render ──────────────────────────────────────────────────────
    let html = '';
    rtCircles.forEach(c => {
      const isGreen = rtState === 'ready' && c.isTarget;
      html += `<div class="reaction-circle ${isGreen ? 'green' : ''}" style="left:${c.x}px; top:${c.y}px;" onmousedown="handleRTCircle(event, ${c.id})" ontouchstart="handleRTCircle(event, ${c.id})"></div>`;
    });
    con.innerHTML = html;
    rtAnimFrame = requestAnimationFrame(loop);
  }
  rtAnimFrame = requestAnimationFrame(loop);
}

function handleRTCircle(e, id) {
  e.stopPropagation(); e.preventDefault();
  if (rtState === 'idle') { rtStart(e); return; }
  if (rtState === 'clicked' || rtState === 'early') { rtStart(e); return; }
  
  if (rtState === 'waiting') {
    clearTimeout(rtTimeout); rtState='early'; updateRTDisplay(); return;
  }
  if (rtState === 'ready') {
    const c = rtCircles.find(x => x.id === id);
    if (c && c.isTarget) {
      rtMs = Math.round(performance.now() - rtStartTime);
      rtRecentScores.push(rtMs); rtState='clicked';
      saveScore(activeTestId, rtMs, true);
      updateRTDisplay();
    } else {
      rtState='early'; updateRTDisplay();
    }
  }
}

function rtStart(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  // Cancel running animation and remove old circles container so it rebuilds fresh each round
  if (rtAnimFrame) { cancelAnimationFrame(rtAnimFrame); rtAnimFrame = null; }
  const oldCc = document.getElementById('rt-circles-container');
  if (oldCc) oldCc.remove();
  rtState = 'waiting'; rtMs = null;
  if (rtTimeout) clearTimeout(rtTimeout);
  rtTimeout = setTimeout(() => {
    rtStartTime = performance.now();
    rtState = 'ready';
    updateRTDisplay();
  }, Math.random()*4000+1000);
  updateRTDisplay();
}

function handleRTParent(e) {
  e.preventDefault();
  if (rtState === 'idle') return rtStart(e);
  if (rtState === 'clicked' || rtState === 'early') return rtStart(e);
  // In circle mode, background taps during waiting/ready do nothing (circles handle interaction)
  if (reactionMode === 'circle') return;
  if (rtState === 'waiting') { clearTimeout(rtTimeout); rtState='early'; updateRTDisplay(); return; }
  if (rtState === 'ready') {
    rtMs = Math.round(performance.now() - rtStartTime);
    rtRecentScores.push(rtMs); rtState='clicked';
    saveScore(activeTestId, rtMs, true);
    updateRTDisplay();
  }
}

/* ===================================================================
   GAME: CPS TEST
   =================================================================== */
let cpsState = 'idle';
let cpsClicks = 0;
let cpsStartTime = 0;
let cpsTimeLeft = 5000;
let cpsAnimId = null;
const CPS_DURATION = 5000;

function renderCpsTest(container) {
  cpsState='idle'; cpsClicks=0; cpsTimeLeft=CPS_DURATION;
  if(cpsAnimId) cancelAnimationFrame(cpsAnimId);
  container.innerHTML = `
    <div>
      <div class="cps-stats">
        <div class="cps-stat-card timer"><div class="cps-stat-val" id="cps-timer">${(CPS_DURATION/1000).toFixed(3)}</div><div class="cps-stat-label">Timer</div></div>
        <div class="cps-stat-card cps"><div class="cps-stat-val" id="cps-live">0.000</div><div class="cps-stat-label">Click/s</div></div>
        <div class="cps-stat-card score"><div class="cps-stat-val" id="cps-score">0</div><div class="cps-stat-label">Score</div></div>
      </div>
      <div id="cps-tap-area" onpointerdown="handleCpsClick(event)">
        <div id="cps-state-text" class="cps-prompt" style="color:#64748b;"></div>
        <div id="cps-result-overlay" class="hidden"></div>
      </div>
      <div class="hud-footer">
        <div class="hud-footer-text">Click / tap as fast as possible.</div>
        <div class="hud-footer-actions">
          <button class="btn-secondary" onclick="goHome()">Back to Dashboard</button>
        </div>
      </div>
    </div>`;
  updateCpsDisplay();
}

function updateCpsDisplay() {
  const txt = document.getElementById('cps-state-text');
  if (txt) txt.textContent = cpsState === 'idle' ? 'CLICK HERE TO START PLAYING' : cpsState === 'playing' ? 'CLICK!' : '';
}

function handleCpsClick(e) {
  e.preventDefault();
  if (cpsState === 'finished') return;
  if (cpsState === 'idle') {
    cpsState = 'playing'; cpsClicks = 1; cpsStartTime = Date.now();
    updateCpsDisplay(); runCpsLoop();
  } else if (cpsState === 'playing') {
    cpsClicks++;
    document.getElementById('cps-score').textContent = cpsClicks;
    const elapsed = (Date.now()-cpsStartTime)/1000;
    if (elapsed > 0.05) document.getElementById('cps-live').textContent = (cpsClicks/elapsed).toFixed(3);
  }
}

function runCpsLoop() {
  if (cpsAnimId) cancelAnimationFrame(cpsAnimId);
  function loop() {
    if (cpsState !== 'playing') return;
    const now = Date.now();
    const elapsed = now - cpsStartTime;
    const left = Math.max(0, CPS_DURATION - elapsed);
    const timerEl = document.getElementById('cps-timer');
    const liveEl = document.getElementById('cps-live');
    if (timerEl) timerEl.textContent = (left/1000).toFixed(3);
    if (liveEl && elapsed > 50) liveEl.textContent = (cpsClicks/(elapsed/1000)).toFixed(3);
    if (left <= 0) { cpsState='finished'; finishCps(); return; }
    cpsAnimId = requestAnimationFrame(loop);
  }
  cpsAnimId = requestAnimationFrame(loop);
}

function finishCps() {
  const cpsFinal = (cpsClicks/5).toFixed(3);
  saveScore(activeTestId, parseFloat((cpsClicks/5).toFixed(2)), true);
  const overlay = document.getElementById('cps-result-overlay');
  if (!overlay) return;
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="inner">
      <div class="label">Result</div>
      <div class="big-cps">${cpsFinal}<span class="unit">CPS</span></div>
      <p>You clicked ${cpsClicks} times in 5 seconds.</p>
      <div class="cps-actions">
        <button class="btn-retry" onpointerdown="e=>e.stopPropagation()" onclick="event.stopPropagation();renderCpsTest(document.getElementById('game-component'))">
          <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Try Again
        </button>
        <button class="btn-green" onpointerdown="e=>e.stopPropagation()" onclick="event.stopPropagation();saveScore(activeTestId,parseFloat((${cpsClicks}/5).toFixed(2)))">
          <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save Score
        </button>
      </div>
    </div>`;

const AIM_TOTAL = 30;

function renderAimTrainer(container) {

function startAim() {
  aimPlaying=true; aimCount=0; aimTimes=[]; aimFinalAvg=null;
  // Clear any lingering targets from previous session
  document.querySelectorAll('#aim-arena .aim-target-btn, #aim-arena #aim-target').forEach(el=>el.remove());
  document.getElementById('aim-hud').style.display='flex';
  document.getElementById('aim-footer-text').textContent = 'Click/tap targets as fast as they appear.';
  document.getElementById('aim-save-btn').classList.add('hidden');
  spawnAimTarget();
}

let aimClickLocked = false; // prevents double-fire from touch+mouse synthetic events

function spawnAimTarget() {
  // Remove every existing target cleanly before spawning a new one
  document.querySelectorAll('#aim-arena .aim-target-btn, #aim-arena #aim-target').forEach(el => el.remove());
  document.getElementById('aim-content').style.display='none';
  aimClickLocked = false; // unlock for the new target
  const top = Math.floor(Math.random()*65)+17;
  const left = Math.floor(Math.random()*65)+17;
  aimLastSpawn = performance.now();
  const t = document.createElement('button');
  t.id = 'aim-target';
  t.className = 'aim-target-btn';
  t.style.cssText = `position:absolute;top:${top}%;left:${left}%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:#3b82f6;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 0 15px rgba(59,130,246,.5);animation:zoomIn .1s ease;border:none;z-index:10;`;
  t.innerHTML = '<div style="width:38px;height:38px;background:#facc15;border-radius:50%;display:flex;align-items:center;justify-content:center;"><div style="width:15px;height:15px;background:#ef4444;border-radius:50%;"></div></div>';
  // Use pointerdown only — one unified event that covers both mouse and touch with no double-fire
  t.addEventListener('pointerdown', handleAimClick);
  document.getElementById('aim-arena').appendChild(t);
  document.getElementById('aim-progress').textContent = `${aimCount+1}/${AIM_TOTAL}`;
  document.getElementById('aim-pct').textContent = Math.round(aimCount/AIM_TOTAL*100);
}

function handleAimClick(e) {
  e.stopPropagation();
  e.preventDefault();
  if (aimClickLocked) return; // block any duplicate events on same target
  aimClickLocked = true;
  // Immediately remove this target so it can't be clicked again
  const tgt = document.getElementById('aim-target');
  if (tgt) tgt.remove();
  const duration = performance.now() - aimLastSpawn;
  aimTimes.push(duration);
  aimCount++;
  if (aimCount >= AIM_TOTAL) {
    finishAim();
  } else {
    spawnAimTarget();
  }
}

function finishAim() {
  aimPlaying = false;
  aimFinalAvg = Math.round(aimTimes.reduce((a,b)=>a+b,0)/AIM_TOTAL);
  saveScore(activeTestId, aimFinalAvg, true);
  // Remove every lingering target button (not just the last one)
  document.querySelectorAll('#aim-arena .aim-target-btn, #aim-arena #aim-target').forEach(el=>el.remove());
  document.getElementById('aim-hud').style.display='none';
  document.getElementById('aim-save-btn').classList.remove('hidden');
  document.getElementById('aim-footer-text').textContent='Benchmarking complete. Save your highscore!';
  const msg = aimFinalAvg < 300 ? 'Spectacular reflex aim speed!' : aimFinalAvg < 450 ? 'Excellent! Above-average precision.' : aimFinalAvg < 600 ? 'Decent aim. Consistent clicking.' : 'Take your time and aim precisely.';
  const content = document.getElementById('aim-content');
  content.style.display='block';
  content.className='aim-result';
  content.innerHTML=`
    <div class="aim-icon-wrap" style="margin:0 auto .75rem;"><div class="aim-mid"><div class="aim-inner"></div></div></div>
    <div class="lbl">Average Time Per Target</div>
    <div class="aim-ms">${aimFinalAvg}<span>ms</span></div>
    <p>${msg}</p>
    <button class="btn-retry" onclick="startAim()" style="margin:0 auto;display:flex;">
      <svg class="icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Try Again
    </button>`;
}

function renderTypingTest(container) {
  typingEnd=false; typingStartTime=null; typingWpm=0; typingAcc=100;

        </div>
        <div id="typing-passage"></div>

          placeholder="Start typing..."></textarea>
        <div id="typing-complete" class="hidden"></div>
      </div>
      <div class="hud-footer">
        <div class="hud-footer-text">Click the box to focus. Backspace, caps, and spacebar all count.</div>
        <div class="hud-footer-actions">
          <button id="typing-save-btn" class="btn-save hidden" onclick="saveScore(activeTestId,typingWpm)">
            <svg class="icon" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save Score
          </button>
          <button class="typing-refresh" onclick="renderTypingTest(document.getElementById('game-component'))">
            <svg class="icon" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Reset
          </button>
          <button class="btn-secondary" onclick="goHome()">Back to Dashboard</button>
        </div>
      </div>
    </div>`;
  renderTypingPassage();
  setTimeout(() => { const inp = document.getElementById('typing-input'); if(inp) inp.focus(); }, 100);
}

function renderTypingPassage() {
  const el = document.getElementById('typing-passage');
  if (!el) return;
  el.innerHTML = typingPara.split('').map((ch,i) => {
    let cls = 'char-default';
    if (i < typingInput.length) cls = typingInput[i]===ch ? 'char-correct' : 'char-wrong';
    else if (i === typingInput.length) cls = 'char-cursor';
    return `<span class="${cls}">${ch === ' ' ? '&nbsp;' : ch}</span>`;
  }).join('');
}

function handleTypingInput(val) {
  if (typingEnd) return;
  if (val.length > typingPara.length) return;
  typingInput = val;

  if (!typingStartTime && val.length === 1) typingStartTime = performance.now();

  let correct = 0;
  for (let i=0;i<val.length;i++) if(val[i]===typingPara[i]) correct++;
  typingAcc = val.length > 0 ? Math.round(correct/val.length*100) : 100;

  if (typingStartTime) {
    const mins = (performance.now()-typingStartTime)/1000/60;
    if (mins > 0.01) typingWpm = Math.round((correct/5)/mins);
  }

  const wpmEl=document.getElementById('typing-wpm'), accEl=document.getElementById('typing-acc'), charEl=document.getElementById('typing-chars');
  if(wpmEl) wpmEl.textContent=typingWpm;
  if(accEl) accEl.textContent=typingAcc+'%';
  if(charEl) charEl.innerHTML=`<strong style="color: #ffffff; font-weight: 700;">${val.length}</strong> <span style="color: #475569;">/ ${typingPara.length} CHARS</span>`;

  renderTypingPassage();

  if (val === typingPara) {
    typingEnd = true;
    const mins=(performance.now()-(typingStartTime||0))/1000/60;
    typingWpm = Math.round((typingPara.length/5)/(mins||1));
    saveScore(activeTestId, typingWpm, true);
    const saveBtn = document.getElementById('typing-save-btn');
    if(saveBtn) saveBtn.classList.remove('hidden');
    const overlay = document.getElementById('typing-complete');
    if (overlay) {
      overlay.classList.remove('hidden');
      overlay.innerHTML=`
        <div id="typing-complete-overlay">
          <div class="inner">
            <svg class="icon" width="32" height="32" fill="#fbbf24" viewBox="0 0 24 24" style="animation:spin 2s linear infinite;margin-bottom:.5rem;"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <h4 style="font-size:1.3rem;font-weight:800;">Passage Completed!</h4>
            <div class="tc-stats">
              <div><div class="tc-stat-val wpm-val">${typingWpm}</div><div class="tc-stat-lbl">WPM</div></div>
              <div><div class="tc-stat-val acc-val">${typingAcc}%</div><div class="tc-stat-lbl">Accuracy</div></div>
            </div>
            <button class="btn-primary" onclick="renderTypingTest(document.getElementById('game-component'))">Try Another</button>
          </div>
        </div>`;
    }
  }
}

function startNumLevel(level) {
  numLevel=level;
  let n='';
  for(let i=0;i<level;i++) n+=(i===0?Math.floor(Math.random()*9)+1:Math.floor(Math.random()*10)).toString();
  numNumber=n; numPhase='showing';
  renderNumContent();
  numShowDuration = 2000 + level*800;
  numShowStart = Date.now();
  if(numProgressInterval) clearInterval(numProgressInterval);
  numProgressInterval=setInterval(()=>{
    const elapsed=Date.now()-numShowStart;
    const pct=Math.max(0,100-(elapsed/numShowDuration)*100);
    const bar=document.getElementById('num-pb'); if(bar) bar.style.width=pct+'%';
    if(elapsed>=numShowDuration){ clearInterval(numProgressInterval); numPhase='typing'; renderNumContent(); }
  },40);
}

function submitNum() {
  const val=(document.getElementById('num-input')?.value||'').trim();
  if(!val) return;
  numSuccess=(val===numNumber); numPhase='result';
  const score = numSuccess ? numLevel : Math.max(0,numLevel-1);
  saveScore(activeTestId, score, true);
  renderNumContent();
  const g=document.getElementById('num-guess'); if(g) g.textContent=val||'(None)';
}

    const s=document.getElementById('chimp-save-btn'); if(s) s.classList.remove('hidden');
  }
}

function startChimp() {
  chimpLevel=1; chimpStrikes=0; chimpTarget=4;
  chimpInitRound(4);
}

function chimpInitRound(n) {
  chimpExpected=1; chimpMasked=false; chimpState='playing';
  const total=CHIMP_ROWS*CHIMP_COLS;
  const slots=Array.from({length:total},(_,i)=>i);
  for(let i=slots.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[slots[i],slots[j]]=[slots[j],slots[i]];}
  chimpTiles=slots.slice(0,n).map((slot,idx)=>({index:slot,number:idx+1,visible:true}));
  renderChimpContent();
}

function chimpClick(num) {
  if(chimpState!=='playing') return;
  if(num===chimpExpected){
    if(num===1) chimpMasked=true;
    chimpTiles=chimpTiles.map(t=>t.number===num?{...t,visible:false}:t);
    const next=chimpExpected+1;
    if(next>chimpTarget){ chimpState='round-success'; saveScore(activeTestId,chimpTarget,true); renderChimpContent(); }
    else { chimpExpected=next; renderChimpContent(); }
  } else {
    chimpStrikes++;
    if(chimpStrikes>=3){ chimpState='game-over'; saveScore(activeTestId,chimpTarget-1,true); renderChimpContent(); }
    else chimpInitRound(chimpTarget);
  }
}

function chimpNextLevel() {
  chimpTarget++; chimpLevel++;
  chimpInitRound(chimpTarget);
}

let vmLevel=1, vmGridSize=3, vmTargetCount=3, vmTargets=[], vmGuesses=[], vmMistakes=[], vmLives=3;
let vmPhase='idle', vmTimeout=null;

function renderVisualMemory(container) {
  vmPhase='idle'; vmLevel=1; vmLives=3;
  if(vmTimeout) clearTimeout(vmTimeout);

function renderVMContent() {
  const el=document.getElementById('vm-content'); if(!el) return;
  if(vmPhase==='idle'){
    el.className='visual-center';
    el.innerHTML=`
      <svg class="icon" style="width:52px;height:52px;color:#34d399;animation:pulse 1.2s infinite;margin:0 auto .75rem;display:block;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>

      <button class="btn-green" onclick="startVisual()">Start Visual Test</button>`;
  } else if(vmPhase==='showing'||vmPhase==='playing'){

          LEVEL: ${vmLevel}
        </span>

function startVisual() {
  vmLevel=1; vmLives=3; vmInitLevel(1);
}

let vmCountdownInterval=null;

function vmInitLevel(lvl) {
  vmGuesses=[]; vmMistakes=[]; vmPhase='showing';
  let n=3, tc=3;
  if(lvl<=2){n=3;tc=2+lvl;}
  else if(lvl<=5){n=4;tc=lvl+1;}
  else if(lvl<=9){n=5;tc=lvl;}
  else{n=6;tc=lvl;}
  vmGridSize=n; vmTargetCount=tc;
  const total=n*n;
  const pool=Array.from({length:total},(_,i)=>i);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  vmTargets=pool.slice(0,tc);
  renderVMContent();
  if(vmTimeout) clearTimeout(vmTimeout);
  if(vmCountdownInterval) clearInterval(vmCountdownInterval);

  // 4-second countdown timer during flash phase
  const FLASH_MS = 4000;
  const flashStart = Date.now();
  vmCountdownInterval = setInterval(() => {
    const remaining = Math.max(0, FLASH_MS - (Date.now() - flashStart));
    const el = document.getElementById('vm-timer-display');
    if (el && vmPhase === 'showing') el.textContent = (remaining / 1000).toFixed(1) + 's';
    if (remaining <= 0) { clearInterval(vmCountdownInterval); vmCountdownInterval = null; }
  }, 50);

  vmTimeout = setTimeout(() => {
    if(vmCountdownInterval){ clearInterval(vmCountdownInterval); vmCountdownInterval=null; }
    vmPhase='playing'; renderVMContent();
  }, FLASH_MS);
}

function vmClick(idx) {
  if(vmPhase!=='playing') return;
  if(vmGuesses.includes(idx)||vmMistakes.includes(idx)) return;
  if(vmTargets.includes(idx)){
    vmGuesses=[...vmGuesses,idx];
    if(vmGuesses.length===vmTargetCount){ vmPhase='round-success'; saveScore(activeTestId,vmLevel,true); renderVMContent(); }
    else renderVMContent();
  } else {
    vmMistakes=[...vmMistakes,idx];
    if(vmMistakes.length>=3){
      vmLives--;
      if(vmLives<=0){ vmPhase='game-over'; saveScore(activeTestId,vmLevel,true); renderVMContent(); }
      else vmInitLevel(vmLevel);
    } else renderVMContent();
  }
}

function vmNextLevel() {
  vmLevel++; vmInitLevel(vmLevel);
}

/* ===================================================================
   GAME: F1 REFLEX
   =================================================================== */
let f1State='idle', f1LitCount=0, f1ElapsedMs=0, f1JumpStart=false;
let f1StartTime=0, f1Timeouts=[], f1AnimId=0;

function renderF1Reflex(container) {
  f1State='idle'; f1LitCount=0; f1ElapsedMs=0; f1JumpStart=false;
  clearF1();
  container.innerHTML=`
    <div id="f1-main" onpointerdown="handleF1(event)" onclick="if(!(event.target.closest('button')))event.preventDefault()">
      <div class="f1-ref-sub" id="f1-sub"></div>
      <div class="f1-timer" id="f1-timer">00.000</div>
      <div class="f1-lights-track">
        <div class="f1-lights-track-bar"></div>
        <div class="f1-lights">
          ${[1,2,3,4,5].map(col=>`
            <div class="f1-panel">
              ${[1,2,3,4].map(()=>`<div class="f1-light" data-col="${col}"></div>`).join('')}
            </div>`).join('')}
        </div>
      </div>
      <p class="f1-instruction" id="f1-inst">Tap/click when ready, then tap again when all lights go out.</p>
      <div id="f1-done-actions" class="hidden"></div>
    </div>`;
}

function clearF1() {
  f1Timeouts.forEach(clearTimeout); f1Timeouts=[];
  cancelAnimationFrame(f1AnimId);
}

function f1UpdateLights() {
  document.querySelectorAll('.f1-light').forEach(el=>{
    const col=parseInt(el.dataset.col);
    el.classList.toggle('lit', col<=f1LitCount);
  });
}

function f1StartGame(e) {
  if(e){e.stopPropagation();e.preventDefault();}
  f1State='running'; f1LitCount=0; f1ElapsedMs=0; f1JumpStart=false;
  clearF1();
  const inst=document.getElementById('f1-inst'); if(inst) inst.textContent='';
  const sub=document.getElementById('f1-sub'); if(sub) sub.textContent='';
  const done=document.getElementById('f1-done-actions'); if(done) done.classList.add('hidden');
  const timer=document.getElementById('f1-timer'); if(timer){timer.textContent='00.000';timer.className='f1-timer';}
  for(let i=1;i<=5;i++){
    const t=setTimeout(()=>{
      f1LitCount=i; f1UpdateLights();
      if(i===5){
        const delay=Math.random()*2000+500;
        const end=setTimeout(()=>{
          f1LitCount=0; f1UpdateLights();
          f1State='reacting'; f1StartTime=performance.now();
          f1AnimId=requestAnimationFrame(f1AnimLoop);
        },delay);
        f1Timeouts.push(end);
      }
    },i*1000);
    f1Timeouts.push(t);
  }
}

function f1AnimLoop(t) {
  if(f1State!=='reacting') return;
  f1ElapsedMs=t-f1StartTime;
  const timer=document.getElementById('f1-timer');
  if(timer) timer.textContent=f1Pad(f1ElapsedMs);
  f1AnimId=requestAnimationFrame(f1AnimLoop);
}

function f1Pad(ms) {
  const s=Math.floor(ms/1000), f=Math.floor(ms%1000);
  return ('0'+s).slice(-2)+'.'+('000'+f).slice(-3);
}

function handleF1(e) {
  if(e.target.closest('button')) return;
  e.stopPropagation();
  if(f1State==='idle'||f1State==='done') { f1StartGame(e); return; }
  if(f1State==='running') {
    clearF1(); f1State='done'; f1JumpStart=true; f1LitCount=0; f1UpdateLights();
    showF1Done(); return;
  }
  if(f1State==='reacting') {
    clearF1(); f1State='done';
    f1ElapsedMs=performance.now()-f1StartTime;
    if(f1ElapsedMs<100){ f1JumpStart=true; }
    else { saveScore(activeTestId,Math.round(f1ElapsedMs),true); }
    showF1Done();
  }
}

function showF1Done() {
  const timer=document.getElementById('f1-timer');
  if(timer){ timer.textContent=f1JumpStart?'JUMP START':f1Pad(f1ElapsedMs); timer.className='f1-timer'+(f1JumpStart?' jump':''); }
  const sub=document.getElementById('f1-sub');
  if(sub) sub.textContent=(!f1JumpStart&&f1ElapsedMs>0)?'F1 Driver Average: 0.200s':'';
  const done=document.getElementById('f1-done-actions');
  if(done){
    done.classList.remove('hidden');
    done.innerHTML=`
      <button class="btn-retry" onpointerdown="e=>e.stopPropagation()" onclick="event.stopPropagation();f1StartGame()">
        <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Try Again
      </button>
      ${!f1JumpStart?`<button class="btn-green" onpointerdown="e=>e.stopPropagation()" onclick="event.stopPropagation();saveScore(activeTestId,Math.round(f1ElapsedMs))">
        <svg class="icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save Score
      </button>`:''}`;
  }
}

  const form=document.getElementById('edit-form'); if(form) form.classList.remove('visible');
  document.getElementById('username-display').querySelector('#uname-text').style.display='';
  document.getElementById('username-display').querySelector('#edit-name-btn').style.display='';
}

function submitEditName(e) {
  e.preventDefault();
  const val=(document.getElementById('edit-input')?.value||'').trim();
  if(!val||!userStats) return;
  userStats.username=val; saveStats();
  renderDrawer();
}

function handleShare() {
  navigator.clipboard.writeText(window.location.href).catch(()=>{});
  const toast=document.getElementById('share-toast'); if(!toast) return;
  toast.classList.add('visible');
  setTimeout(()=>toast.classList.remove('visible'),2500);
}

function handleReset() {
  if(window.confirm('Are you absolutely sure you want to reset all benchmark records?')) {
    initNewUser();
    closeDrawer();
  }
}

/* ===================================================================
   INIT
   =================================================================== */
function init() {
  initTheme();
  loadStats();

  // Check URL params
  const params=new URLSearchParams(window.location.search);
  const testParam=params.get('test');
  const viewParam=params.get('view');
  if(testParam&&TESTS.find(t=>t.id===testParam)){
    activeTestId=testParam;
    if(viewParam==='stats') { showScreen('stats'); renderStatsScreen(); }
    else { showScreen('playing'); renderPlayingScreen(); }
  } else {
    showScreen('dashboard');
    renderDashboard();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
